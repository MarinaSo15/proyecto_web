    <div id="miLightbox" class="lightbox" onclick="cerrarImagen()">
        <span class="cerrar">&times;</span>
        <img class="contenido-lightbox" id="imagenGrande">
    </div>

    <script>
        function abrirImagen(elemento) {
            document.getElementById("miLightbox").style.display = "flex";
            document.getElementById("imagenGrande").src = elemento.src;
        }
        function cerrarImagen() {
            document.getElementById("miLightbox").style.display = "none";
        }
    </script>
